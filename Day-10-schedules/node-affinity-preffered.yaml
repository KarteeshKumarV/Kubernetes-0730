apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-pref-deployment
  labels:
    key: app
    value: blue
spec:
  replicas: 3
  selector:
    matchLabels:
      key: app
      value: blue
  template:
    metadata:
      labels:
        key: app
        value: blue
    spec:
      containers:
      - name: nginx
        image: nginx
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 1
            preference:
              matchExpressions:
              - key: clr
                operator: In
                values:
                - green
          - weight: 50
            preference:
              matchExpressions:
              - key: clr
                operator: In
                values:
                - yellow
