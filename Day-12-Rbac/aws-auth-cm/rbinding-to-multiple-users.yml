apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding

metadata:
  name: pod-reader-binding
  namespace: dev

subjects:
- kind: User
  name: prod
  apiGroup: rbac.authorization.k8s.io

- kind: User
  name: dev
  apiGroup: rbac.authorization.k8s.io

- kind: User
  name: test
  apiGroup: rbac.authorization.k8s.io

roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io
